<style>
  :root{
    --primary:#1D4ED8; --primary-dark:#1E3A8A;
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0;
    --text:#0f172a; --muted:#64748b;
    --green:#16a34a; --orange:#ea580c; --red:#dc2626; --purple:#7c3aed;
  }
  *{box-sizing:border-box;}
  button{font-family:inherit;color:inherit;}
  html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);}
  #app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:76px;}
  .header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:18px 16px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .header h1{font-size:18px;font-weight:800;margin:0;flex:1;}
  .icon-btn{background:none;border:none;color:#fff;padding:4px;border-radius:999px;font-size:20px;line-height:1;cursor:pointer;}
  .icon-btn.solid{background:rgba(255,255,255,.18);}
  .content{padding:14px 16px 8px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;}
  .stat-card.clickable{cursor:pointer;}
  .stat-card.clickable:active{opacity:0.65;}
  .stat-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;}
  .stat-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:2px;}
  .stat-value{font-size:16px;font-weight:800;}
  .section-title{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 8px;}
  .quick-btn{border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1px solid var(--border);background:var(--card);font-weight:700;font-size:14px;cursor:pointer;width:100%;text-align:left;}
  .quick-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .quick-btn .qi{font-size:20px;}
  .list-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:default;}
  .list-item.clickable{cursor:pointer;}
  .row-name{font-weight:700;font-size:14px;color:var(--text);}
  .row-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .row-right{text-align:right;}
  .amt{font-weight:800;font-size:14px;}
  .tiny{font-size:10px;font-weight:600;}
  .red{color:var(--red);} .green{color:var(--green);} .orange{color:var(--orange);} .purple{color:var(--purple);} .blue{color:var(--primary);} .muted{color:var(--muted);}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:30;}
  .bottom-nav-inner{width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--border);display:flex;}
  .nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;color:var(--muted);cursor:pointer;font-family:inherit;}
  .nav-btn.active{color:var(--primary);}
  .nav-btn .ni{font-size:19px;}
  .nav-btn .nl{font-size:10.5px;font-weight:600;}
  label.field-label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=tel],input[type=date],select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  .field{margin-bottom:12px;}
  .btn{width:100%;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--primary);} .btn.green{background:var(--green);} .btn.red{background:var(--red);} .btn.purple{background:var(--purple);}
  .toggle-row{display:flex;gap:8px;}
  .toggle-btn{flex:1;border-radius:10px;padding:9px 0;font-size:12px;font-weight:700;text-transform:capitalize;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit;}
  .toggle-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
  .search input{border:none;padding:0;flex:1;}
  .search input:focus{outline:none;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:36px 0;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .modal-sheet{width:100%;max-width:400px;background:var(--card);border-radius:18px;padding:16px;max-height:80vh;overflow-y:auto;}
  .modal-title{font-weight:800;font-size:15px;margin-bottom:12px;}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:50;}
  .ledger-wrap{background-image:repeating-linear-gradient(#fdfaf3 0px,#fdfaf3 27px,#e7ddc4 28px);background-color:#fdfaf3;border:1px solid #f3e3b8;border-radius:14px;overflow:hidden;}
  .ledger-head{display:grid;grid-template-columns:2fr 1fr 1fr;font-size:10.5px;font-weight:800;color:#94a3b8;padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.03em;}
  .ledger-row{display:grid;grid-template-columns:2fr 1fr 1fr;align-items:center;padding:6px 12px;font-size:12px;}
  .ledger-row.clickable{cursor:pointer;}
  .ledger-row.clickable:active{background:rgba(0,0,0,.04);}
  .ledger-desc{font-weight:600;color:#334155;}
  .ledger-date{font-size:10px;color:#94a3b8;}
  .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .product-card-imgwrap{width:100%;aspect-ratio:1/1;background:#f1f5f9;position:relative;overflow:hidden;}
  .product-card-imgwrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-card-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#cbd5e1;}
  .product-card-badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;background:#fff7ed;color:#c2410c;}
  .product-card-badge.expired{background:#fef2f2;color:#991b1b;}
  .product-card-body{padding:10px 12px 12px;}
  .product-card-name{font-weight:700;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .product-card-price{font-weight:800;font-size:14.5px;margin-top:3px;}
  .product-card-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .product-card-actions{display:flex;gap:6px;margin-top:9px;}
  .product-card-actions .icon-mini-btn{flex:1;text-align:center;}
  .item-row{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;}
  .item-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qty-stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .qty-stepper button{background:none;border:none;padding:7px 9px;color:#64748b;font-size:14px;cursor:pointer;}
  .qty-stepper input{width:48px;text-align:center;border:none;padding:6px 0;font-size:13px;}
  .qty-stepper input:focus{outline:none;}
  .rate-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:7px 8px;text-align:right;font-size:13px;}
  .item-controls{display:flex;align-items:center;gap:8px;}
  .save-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;z-index:35;}
  .save-bar-inner{width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--border);padding:12px 14px;}
  .add-item-link{color:var(--primary);font-size:12.5px;font-weight:700;background:none;border:none;cursor:pointer;font-family:inherit;}
  .icon-mini-btn{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;line-height:1;}
  .icon-mini-btn.danger{border-color:#fecaca;background:#fef2f2;color:#991b1b;}
  .dashed-add{width:100%;border:2px dashed var(--border);border-radius:12px;padding:22px 0;color:#94a3b8;font-size:13px;font-weight:600;background:none;cursor:pointer;font-family:inherit;}
  .picker-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer;}
  .suggest-wrap{position:relative;}
  .suggest-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-top:4px;max-height:230px;overflow-y:auto;box-shadow:0 8px 22px rgba(0,0,0,.14);z-index:25;display:none;}
  .suggest-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13.5px;}
  .suggest-row:last-child{border-bottom:none;}
  .suggest-row .sr-name{font-weight:700;}
  .suggest-row .sr-sub{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .suggest-row.add-new{color:var(--primary);font-weight:700;}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;}
  .summary-row.bold{font-weight:800;}
  .diag{font-family:sans-serif;max-width:420px;margin:60px auto;padding:20px;text-align:center;color:#64748b;}
  .bill-wrap{background:#fff;color:#0f172a;border:1px solid var(--border);border-radius:16px;padding:20px 18px;}
  .bill-shop{text-align:center;margin-bottom:14px;}
  .bill-shop-name{font-size:17px;font-weight:800;}
  .bill-shop-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .bill-meta{display:flex;justify-content:space-between;font-size:12px;color:#334155;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);padding:10px 0;margin-bottom:10px;}
  .bill-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;}
  .bill-table th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .bill-table td{padding:6px 0;border-bottom:1px solid #f1f5f9;}
  .bill-table td.r, .bill-table th.r{text-align:right;}
  .bill-totals{font-size:13px;}
  .bill-totals .summary-row{padding:4px 0;}
  .bill-footer{text-align:center;margin-top:14px;font-size:12px;color:var(--muted);font-style:italic;}
  .report-tile{display:flex;align-items:center;justify-content:space-between;}
  .report-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .report-table th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--border);}
  .report-table td{padding:7px 4px;border-bottom:1px solid #f1f5f9;}
  .report-table td.r, .report-table th.r{text-align:right;}
  @media print{
    .header,.bottom-nav,.save-bar,#toastHost,.no-print{display:none !important;}
    body,#app{background:#fff;}
    #app{max-width:100%;padding-bottom:0;}
    .bill-wrap,.report-wrap{border:none;box-shadow:none;}
  }
  .splash-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s ease;}
  .splash-screen.hide{opacity:0;pointer-events:none;}
  .splash-logo{width:150px;height:150px;border-radius:32px;box-shadow:0 10px 34px rgba(0,0,0,.55);}
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 22px;}
  .login-logo{font-size:38px;text-align:center;margin-bottom:6px;}
  .login-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:2px;}
  .login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:22px;}
  .offline-banner{background:#fef2f2;color:#991b1b;font-size:11.5px;font-weight:700;text-align:center;padding:8px;border-radius:10px;margin-bottom:14px;}
  .catalog-header{background:var(--primary);color:#fff;padding:22px 16px;text-align:center;}
  .catalog-shopname{font-size:20px;font-weight:800;}
  .catalog-sub{font-size:12px;opacity:.85;margin-top:2px;}
  .cat-product-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .cat-price-row{display:flex;align-items:baseline;gap:6px;margin-top:3px;}
  .count-badge{position:absolute;top:8px;right:8px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;min-width:18px;text-align:center;}
  .cat-mrp{font-size:11px;color:var(--muted);text-decoration:line-through;}
</style>
</head>

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function fileToCompressedDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w>maxDim || h>maxDim){
          if (w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality||0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
/* ---------- Image storage: Firebase Storage (Blob upload) ----------
   New images are compressed in-browser to a Blob and uploaded to
   Firebase Cloud Storage; only the resulting download URL is ever
   saved into STATE / Realtime Database / localStorage.
   Old data may still contain "data:image/..." Base64 strings from
   before this change — those continue to render fine in <img src>
   and are left untouched unless the user explicitly replaces them. */
function fileToCompressedBlob(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w>maxDim || h>maxDim){
          if (w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
          else { w = Math.round(w*maxDim/h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(function(blob){
          if (blob) resolve(blob); else reject(new Error("Blob banane me dikkat aayi"));
        }, "image/jpeg", quality||0.75);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function isLegacyBase64Photo(photo){
  return typeof photo === "string" && photo.indexOf("data:image/")===0;

/* ---------- Cloudinary (unsigned upload) ----------
   Images are uploaded directly from the browser to Cloudinary using an
   UNSIGNED upload preset — no API secret is ever used/stored client-side.
   Only the returned secure_url is saved into STATE/Realtime Database. */
const CLOUDINARY_CLOUD_NAME = "lusxlove";
const CLOUDINARY_UPLOAD_PRESET = "mydukaan_unsigned";
function isCloudinaryUrl(url){
  return typeof url === "string" && url.indexOf("res.cloudinary.com")!==-1;
}
async function uploadImageToStorage(blob, folder){
  const formData = new FormData();
  formData.append("file", blob);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  if (folder) formData.append("folder", folder);
  const endpoint = "https://api.cloudinary.com/v1_1/"+CLOUDINARY_CLOUD_NAME+"/image/upload";
  const res = await fetch(endpoint, {method:"POST", body:formData});
  if (!res.ok) throw new Error("Cloudinary upload failed");
  const data = await res.json();
  if (!data.secure_url) throw new Error("Cloudinary upload failed");
  return data.secure_url;
}
function deleteImageFromStorageSafe(url){
  // Deleting a Cloudinary asset requires a signed request (API secret),
  // which must never live in client-side code. So old/replaced images
  // are simply left in Cloudinary rather than risk exposing credentials.
  // This is a deliberate no-op for Cloudinary; well within free-tier
  // limits for typical shop-level photo volumes.
}

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function inPeriod(dateStr, period){
  const today = todayStr();
  if (period==="today") return dateStr===today;
  if (period==="week") return dateStr>=daysAgo(6);
  if (period==="month") return dateStr>=daysAgo(29);
  return true;
}

/* ---------- derived calculations ---------- */
function custBalance(id){
  const c = STATE.customers.find(x=>x.id===id);
  const salesTotal = STATE.sales.filter(s=>s.customerId===id).reduce((a,s)=>a+s.balance,0);
  const paidLater = STATE.payments.filter(p=>p.customerId===id).reduce((a,p)=>a+p.amount,0);
  return (c?c.opening:0) + salesTotal - paidLater;
}
function suppBalance(id){
  const s = STATE.suppliers.find(x=>x.id===id);
  const purchTotal = STATE.purchases.filter(p=>p.supplierId===id).reduce((a,p)=>a+p.balance,0);
  const paidLater = STATE.supplierPayments.filter(p=>p.supplierId===id).reduce((a,p)=>a+p.amount,0);
  return (s?s.opening:0) + purchTotal - paidLater;
}
function derivedDashboard(){
  const today = todayStr();
  const todaysSales = STATE.sales.filter(s=>s.date===today);
  const todaysExpenses = STATE.expenses.filter(e=>e.date===today);
  const todaysPurchases = STATE.purchases.filter(p=>p.date===today);
  const todaySalesTotal = todaysSales.reduce((a,s)=>a+s.total,0);
  const todayCash = todaysSales.reduce((a,s)=>a+s.paid,0);
  const todayCredit = todaysSales.reduce((a,s)=>a+s.balance,0);
  const todayExpenseTotal = todaysExpenses.reduce((a,e)=>a+e.amount,0);
  const todayProfit = todaysSales.reduce((a,s)=>a+s.profit,0) - todayExpenseTotal;
  const lowStock = STATE.products.filter(p=>p.qty<=p.minLevel);
  const stockValue = STATE.products.reduce((a,p)=>a+p.qty*p.purchasePrice,0);
  const todayDate = new Date(todayStr());
  const in30 = new Date(); in30.setDate(in30.getDate()+30);
  const expiring = STATE.products.filter(p=>{
    if (!p.expiryDate) return false;
    const ed = new Date(p.expiryDate);
    return ed >= todayDate && ed <= in30;
  });
  const expired = STATE.products.filter(p=> p.expiryDate && new Date(p.expiryDate) < todayDate);
  const totalUdhar = STATE.customers.reduce((a,c)=>a+Math.max(custBalance(c.id),0),0);
  const totalPayable = STATE.suppliers.reduce((a,s)=>a+Math.max(suppBalance(s.id),0),0);
  return {todaySalesTotal,todayCash,todayCredit,todayProfit,lowStock,stockValue,totalUdhar,totalPayable,expiring,expired};
}
function cashBookData(period){
  const inRows = [
    ...STATE.sales.filter(s=>s.paid>0 && inPeriod(s.date,period)).map(s=>({date:s.date,desc:"Sale · Bill #"+s.billNo,amount:s.paid})),
    ...STATE.payments.filter(p=>inPeriod(p.date,period)).map(p=>({date:p.date,desc:"Customer payment received",amount:p.amount})),
    ...STATE.income.filter(i=>inPeriod(i.date,period)).map(i=>({date:i.date,desc:"Income · "+i.category,amount:i.amount})),
  ];
  const outRows = [
    ...STATE.purchases.filter(p=>p.paid>0 && inPeriod(p.date,period)).map(p=>({date:p.date,desc:"Purchase · "+p.invoiceNo,amount:p.paid})),
    ...STATE.expenses.filter(e=>inPeriod(e.date,period)).map(e=>({date:e.date,desc:"Expense · "+e.category,amount:e.amount})),
    ...STATE.supplierPayments.filter(p=>inPeriod(p.date,period)).map(p=>({date:p.date,desc:"Supplier payment made",amount:p.amount})),
  ];
  const cashIn = inRows.reduce((a,r)=>a+r.amount,0);
  const cashOut = outRows.reduce((a,r)=>a+r.amount,0);
  const rows = [...inRows.map(r=>({...r,dir:"in"})), ...outRows.map(r=>({...r,dir:"out"}))].sort((a,b)=>b.date.localeCompare(a.date));
  return {cashIn,cashOut,closing:cashIn-cashOut,rows};
}

async function attemptShopLogin(){
  const mobile = document.getElementById("li_mobile").value.trim();
  const password = document.getElementById("li_password").value;
  if (!mobile || !password){ setLoginError("Mobile aur password dono bharen"); return; }
  setLoginError("Check ho raha hai…");
  try {
    const idxSnap = await fbdb.ref("shopIndex/"+mobile).once("value");
    const shopId = idxSnap.val();
    if (!shopId){ setLoginError("Ye mobile number registered nahi hai"); return; }
    const metaSnap = await fbdb.ref("shops/"+shopId+"/meta").once("value");
    const meta = metaSnap.val();
    if (!meta){ setLoginError("Shop data nahi mila"); return; }
    if (meta.active===false){ setLoginError("Ye account deactivate kar diya gaya hai. Support se sampark karein."); return; }
    const hash = await sha256Hex(password);
    if (hash !== meta.passwordHash){ setLoginError("Password galat hai"); return; }
    SESSION = {shopId}; saveSession(SESSION);
    const ok = await tryRestoreShopSession(shopId);
    if (ok){ ROUTE="app"; TAB="dashboard"; SCREEN=null; render(); }
    else { setLoginError("Kuch galat hua, dobara try karein"); }
  } catch(e){
    setLoginError("Internet connect nahi ho paya, dobara try karein");
  }
}
async function tryRestoreShopSession(shopId){
  try {
    const metaSnap = await fbdb.ref("shops/"+shopId+"/meta").once("value");
    const meta = metaSnap.val();
    if (!meta || meta.active===false){ clearSession(); SESSION=null; return false; }
    CURRENT_SHOP_ID = shopId;
    CURRENT_SHOP_META = meta;
    let data = loadLocalShopState(shopId);
    try {
      const dataSnap = await fbdb.ref("shops/"+shopId+"/data").once("value");
      const remote = dataSnap.val();
      if (remote) data = normalizeState(remote);
    } catch(e){ /* offline — local cache use hoga */ }
    STATE = data;
    applyTheme(STATE.settings.theme);
    listenOrders();
    return true;
  } catch(e){
    return false;
  }
}

async function toggleSubscriptionPayment(shopId){
  const s = SA_SHOPS.find(function(x){ return x.id===shopId; });
  if (!s) return;
  const mk = currentMonthKey();
  const sub = s.subscription || {};
  const payments = Object.assign({}, sub.payments);
  const newVal = !payments[mk];
  payments[mk] = newVal;
  try {
    await fbdb.ref("shops/"+shopId+"/meta/subscription/payments/"+mk).set(newVal);
    s.subscription = Object.assign({}, sub, {payments:payments});
    softRenderSAShops();

    toast(newVal ? "Is mahine ka payment Received mark ho gaya" : "Is mahine ka payment Due mark ho gaya");

async function toggleShopActive(shopId){

/* ---------- Public Product Catalog ---------- */
async function loadCatalogData(shopId){
  CATALOG_SHOP_ID = shopId;
  try {
    const metaSnap = await fbdb.ref("shops/"+shopId+"/meta").once("value");
    const meta = metaSnap.val();
    if (!meta || meta.active===false){ CATALOG_DATA = {error:"Ye shop abhi available nahi hai"}; render(); return; }
    const prodSnap = await fbdb.ref("shops/"+shopId+"/data/products").once("value");
    const raw = prodSnap.val() || [];
    const products = Array.isArray(raw) ? raw.filter(Boolean) : Object.values(raw);
    CATALOG_DATA = {shopName: meta.shopName, products: products};
    if (CATALOG_PRODUCT_ID){
      const p = products.find(function(x){ return x.id===CATALOG_PRODUCT_ID; });
      if (p) CATALOG_CART[p.id] = 1;
    }
    render();
  } catch(e){
    CATALOG_DATA = {error:"Internet connection check karein"};
    render();
  }
}

/* ---------- Customer ordering (from public catalog / product link) ---------- */
function cartItemIds(){
  return Object.keys(CATALOG_CART).filter(function(id){ return CATALOG_CART[id]>0; });
}
function cartTotal(){
  let total = 0;
  cartItemIds().forEach(function(id){
    const p = CATALOG_DATA.products.find(function(x){ return x.id===id; });
    if (p) total += (Number(p.sellingPrice)||0) * CATALOG_CART[id];
  });
  return total;
}
function renderSelectedItemsHtml(){
  const ids = cartItemIds();
  if (ids.length===0) return '';
  let total = 0;
  const rows = ids.map(function(id){
    const p = CATALOG_DATA.products.find(function(x){ return x.id===id; });
    if (!p) return '';
    const qty = CATALOG_CART[id];
    const sub = (Number(p.sellingPrice)||0) * qty;
    total += sub;
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);">'+
      '<div style="flex:1;min-width:0;padding-right:8px;">'+
      '<div style="font-weight:700;font-size:13px;">'+esc(p.name)+'</div>'+
      '<div class="tiny muted">'+fmt(p.sellingPrice)+' × '+qty+'</div>'+
      '</div>'+
      '<div style="font-weight:800;font-size:13.5px;white-space:nowrap;">'+fmt(sub)+'</div>'+
      '</div>';
  }).join('');
  return '<div class="card" style="margin-top:16px;" id="selectedItemsCard">'+
    '<div class="section-title" style="margin-top:0;">🛒 Selected Items ('+ids.length+')</div>'+
    rows+
    '<div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;font-weight:800;font-size:15.5px;">'+
    '<span>Total</span><span>'+fmt(total)+'</span></div>'+
    '</div>';
}
function updateSelectedItemsUI(){
  const wrap = document.getElementById("selectedItemsWrap");
  if (wrap) wrap.innerHTML = renderSelectedItemsHtml();
}
function adjustCartQty(pid, delta){
  const newQty = Math.max(0, (CATALOG_CART[pid]||0)+delta);
  if (newQty>0) CATALOG_CART[pid] = newQty; else delete CATALOG_CART[pid];
  const el = document.getElementById("catqty_"+pid);
  if (el) el.textContent = newQty;
  updateSelectedItemsUI();
}
function setOrderError(msg){ const el=document.getElementById("orderErrorBox"); if (el) el.textContent=msg; }
async function submitCustomerOrder(){
  if (!CATALOG_DATA) return;
  const nameEl = document.getElementById("cust_name");
  const mobileEl = document.getElementById("cust_mobile");
  const addrEl = document.getElementById("cust_address");
  const name = (nameEl && nameEl.value || "").trim();
  const mobile = (mobileEl && mobileEl.value || "").trim();
  const address = (addrEl && addrEl.value || "").trim();
  CATALOG_CUSTOMER = {name:name, mobile:mobile, address:address};
  const itemIds = cartItemIds();
  if (!name){ setOrderError("Apna naam likhein"); return; }
  if (!/^[0-9]{10}$/.test(mobile)){ setOrderError("Sahi 10-digit mobile number likhein"); return; }
  if (itemIds.length===0){ setOrderError("Kam se kam 1 product ki quantity select karein"); return; }
  setOrderError("Order bheja ja raha hai…");
  try{
    const items = itemIds.map(function(id){
      const p = CATALOG_DATA.products.find(function(x){ return x.id===id; });
      return {productId:id, name:p.name, price:p.sellingPrice||0, unit:p.unit||"piece", qty:CATALOG_CART[id]};
    });
    const total = items.reduce(function(s,it){ return s + it.price*it.qty; },0);
    const order = {
      items:items, total:total,
      customerName:name, customerMobile:mobile, customerAddress:address,
      status:"new", createdAt:new Date().toISOString()
    };
    await fbdb.ref("shops/"+CATALOG_SHOP_ID+"/orders").push(order);
    CATALOG_CART = {};
    CATALOG_CUSTOMER = {name:name, mobile:mobile, address:address};
    render();
    toast("Order bhej diya gaya — shopkeeper aapse contact karega");
  } catch(e){ setOrderError("Order bhejne me error — internet check karein"); }
}

function listenOrders(){
  if (!CURRENT_SHOP_ID) return;
  try{
    fbdb.ref("shops/"+CURRENT_SHOP_ID+"/orders").on("value", function(snap){

function productStats(pid){
  let qtySold=0, revenue=0;
  STATE.sales.forEach(s=>{
    (s.items||[]).forEach(i=>{
      if (i.productId===pid){ qtySold += Number(i.qty)||0; revenue += (Number(i.qty)||0)*(Number(i.price)||0); }
    });
  });
  const p = STATE.products.find(x=>x.id===pid);
  const cost = p ? qtySold*p.purchasePrice : 0;
  return {qtySold, revenue, cost, profit: revenue-cost};
}
function topLowSellingProducts(){
  const sold = STATE.products.map(p=>({p, qtySold: productStats(p.id).qtySold})).filter(x=>x.qtySold>0);
  if (sold.length===0) return {top:null, low:null};
  const top = sold.reduce((a,b)=> b.qtySold>a.qtySold ? b : a);
  const low = sold.reduce((a,b)=> b.qtySold<a.qtySold ? b : a);
  return {top,low};
}
function productTopLowBanner(){
  const {top, low} = topLowSellingProducts();

    '<div class="stat-card clickable" style="background:#f0fdf4;border-color:#bbf7d0;" onclick="openProductDetail(\''+top.p.id+'\')">' +

  if (prev) prev.innerHTML = '<span style="font-size:11px;">⏳</span>';

    // Not uploaded yet — kept as a pending Blob + local preview URL.

    if (DRAFT.productForm._pendingPhotoPreviewUrl) URL.revokeObjectURL(DRAFT.productForm._pendingPhotoPreviewUrl);
    DRAFT.productForm._pendingPhotoBlob = blob;
    DRAFT.productForm._pendingPhotoPreviewUrl = URL.createObjectURL(blob);
    if (prev) prev.innerHTML = '<img src="'+DRAFT.productForm._pendingPhotoPreviewUrl+'" style="width:100%;height:100%;object-fit:cover;">';
    if (rm) rm.style.display = "";
  }).catch(()=>{

async function saveProductForm(){
  const name = document.getElementById("f_name").value.trim();
  const sellingPrice = document.getElementById("f_sp").value;
  if (!name || !sellingPrice){ toast("Naam aur selling price zaroori hai"); return; }
  const draft = DRAFT.productForm || {};
  const editId = draft.editId;
  const isEdit = !!editId;
  const btn = document.getElementById("pf_saveBtn");
  const pendingBlob = draft._pendingPhotoBlob;

  if (pendingBlob && !navigator.onLine){
    toast("Photo upload karne ke liye internet connection zaroori hai");
    return;
  }
  if (btn) btn.disabled = true;

  const existingProduct = isEdit ? STATE.products.find(x=>x.id===editId) : null;
  const oldPhotoUrl = existingProduct ? (existingProduct.photo||"") : "";
  let photoUrl = draft.photo || "";
  const newProductId = isEdit ? editId : (draft._newIdForPhoto || uid());
  draft._newIdForPhoto = newProductId;

  if (pendingBlob){
    try {
      if (btn) btn.textContent = "Photo upload ho rahi hai...";
      const folder = "mydukaan/shops/"+CURRENT_SHOP_ID+"/products/"+newProductId;
      photoUrl = await uploadImageToStorage(pendingBlob, folder);
    } catch(e){
      toast("Photo upload fail ho gayi — internet check karke dobara try karein");
      if (btn){ btn.disabled = false; btn.textContent = isEdit?"Update Product":"Save Product"; }
      return;
    }
  }

  if (btn) btn.textContent = "Product save ho raha hai...";
  const fields = {
    name, category: document.getElementById("f_category").value, unit: document.getElementById("f_unit").value,
    purchasePrice: Number(document.getElementById("f_pp").value)||0, sellingPrice: Number(sellingPrice)||0,
    mrp: Number(document.getElementById("f_mrp").value)||0,
    qty: Number(document.getElementById("f_qty").value)||0, minLevel: Number(document.getElementById("f_min").value)||0,
    batchNumber: document.getElementById("f_batch").value.trim(), expiryDate: document.getElementById("f_expiry").value,
    barcode: document.getElementById("f_barcode").value.trim(),
    photo: photoUrl,
  };
  const returnCtx = DRAFT.productFormReturn;
  DRAFT.productFormReturn = null;
  if (draft._pendingPhotoPreviewUrl) URL.revokeObjectURL(draft._pendingPhotoPreviewUrl);
  if (isEdit){
    const idx = STATE.products.findIndex(x=>x.id===editId);
    if (idx>-1) STATE.products[idx] = { ...STATE.products[idx], ...fields };
    persist(); DRAFT.productForm=null;
    if (oldPhotoUrl && oldPhotoUrl!==photoUrl) deleteImageFromStorageSafe(oldPhotoUrl);
    toast("Product updated");
    finishProductForm(returnCtx, null);
  } else {
    const newProd = {id: newProductId, ...fields};
    STATE.products.push(newProd);
    persist(); DRAFT.productForm=null;
    toast("Product added");
    finishProductForm(returnCtx, newProd);
  }
}
function finishProductForm(returnCtx, newProd){
  if (returnCtx==="sale" && DRAFT.sale){
    if (newProd && !DRAFT.sale.items.find(i=>i.productId===newProd.id)) DRAFT.sale.items.push({productId:newProd.id,qty:1,price:newProd.sellingPrice});
    openScreen({type:"newSale"});
  } else if (returnCtx==="purchase" && DRAFT.purchase){
    if (newProd && !DRAFT.purchase.items.find(i=>i.productId===newProd.id)) DRAFT.purchase.items.push({productId:newProd.id,qty:1,rate:newProd.purchasePrice});
    openScreen({type:"newPurchase"});
  } else {
    openScreen({type:"products"});
  }
}

async function lookupBarcodeOnline(){
  const codeEl = document.getElementById("f_barcode");
  const statusEl = document.getElementById("onlineLookupStatus");
  const code = codeEl ? codeEl.value.trim() : "";
  if (!code){ if(statusEl) statusEl.textContent = "Pehle barcode number bharein."; return; }
  if (statusEl) statusEl.textContent = "Dhoond rahe hain…";
  try {
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 6000);
    const res = await fetch("https://world.openfoodfacts.org/api/v0/product/"+encodeURIComponent(code)+".json", {signal:controller.signal});
    clearTimeout(timeout);
    const data = await res.json();
    if (data && data.status===1 && data.product){
      const p = data.product;
      const name = p.product_name || p.generic_name || "";
      const brand = p.brands || "";
      if (name){
        const nameEl = document.getElementById("f_name");
        if (nameEl && !nameEl.value) nameEl.value = brand ? (name+" ("+brand+")") : name;
        if (statusEl) statusEl.innerHTML = '<span class="green">✓ Mil gaya: '+esc(name)+(brand?" · "+esc(brand):"")+'. Naam field me bhar diya — MRP/price/stock khud check karke bharein.</span>';
      } else {
        if (statusEl) statusEl.textContent = "Barcode mila, par naam available nahi tha. Manually bharein.";
      }
    } else {
      if (statusEl) statusEl.textContent = "Ye barcode online database me nahi mila. Manually bharein.";
    }
  } catch(err){
    if (statusEl) statusEl.textContent = "Internet nahi mil raha (ya ye viewer external requests block kar raha hai). Manually bharein.";
  }
}

function openReceivePayment(id, kind){

function renderModal(){
  const host = document.getElementById("toastHost");
  if (!DRAFT.payModal){ return; }
  const {kind} = DRAFT.payModal;
  const title = kind==="customer" ? "Receive Payment" : "Pay Supplier";
  const btnClass = kind==="customer" ? "green" : "purple";
  host.innerHTML = '<div class="modal-overlay" onclick="closeModal(event)">'+
    '<div class="modal-sheet" onclick="event.stopPropagation()">'+
    '<div class="modal-title">'+title+'</div>'+
    field("Amount","number","modalAmount","",true)+
    '<button class="btn '+btnClass+'" onclick="submitPayment()">Save Payment</button>'+
    '</div></div>';
  setTimeout(()=>{ const el=document.getElementById("modalAmount"); if(el) el.focus(); }, 30);
}
function closeModal(e){ if (e && e.target !== e.currentTarget) return; DRAFT.payModal=null; document.getElementById("toastHost").innerHTML=""; }
function submitPayment(){
  const amt = Number(document.getElementById("modalAmount").value);
  if (!amt || amt<=0){ toast("Sahi amount daalein"); return; }
  const {id,kind} = DRAFT.payModal;
  if (kind==="customer"){
    STATE.payments.push({id:uid(),customerId:id,amount:amt,date:todayStr()});
  } else {
    STATE.supplierPayments.push({id:uid(),supplierId:id,amount:amt,date:todayStr()});
  }
  persist();
  DRAFT.payModal=null; document.getElementById("toastHost").innerHTML="";
  toast("Payment recorded");
  render();
}

  const s = STATE.sales.find(x=>x.id===id);
  if (!s) return;
  DRAFT.sale = {
    editId: id, origBillNo: s.billNo, origDate: s.date, origTime: s.time || "", origItems: JSON.parse(JSON.stringify(s.items)),
    customerId: s.customerId || "", items: JSON.parse(JSON.stringify(s.items)),
    discount: String(s.discount||0), mode: s.mode, received: s.mode==="partial" ? String(s.paid) : "",
  };
  openScreen({type:"newSale"});
}
function deleteSale(id){
  const s = STATE.sales.find(x=>x.id===id);
  if (!s) return;
  const ok = confirm("Bill #"+s.billNo+" ko delete karein? Stock wapas add ho jaayega, aur ye action undo nahi ho sakta.");
  if (!ok) return;
  s.items.forEach(i=>{ const p=STATE.products.find(x=>x.id===i.productId); if(p) p.qty += Number(i.qty); });
  STATE.sales = STATE.sales.filter(x=>x.id!==id);
  persist();
  toast("Bill deleted");
  TAB="sales"; SCREEN=null; render();
}

function saleTotals(){
  const d = DRAFT.sale;
  const subtotal = d.items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.price||0),0);
  const total = Math.max(subtotal - Number(d.discount||0), 0);
  const isCredit = d.mode==="credit";
  const paid = isCredit ? 0 : d.mode==="partial" ? Number(d.received||0) : total;
  const balance = Math.max(total-paid,0);
  return {subtotal,total,paid,balance};
}
function saleItemsInner(){
  const d = DRAFT.sale;
  if (d.items.length===0) return '<button class="dashed-add" onclick="openProductPicker(\'sale\')">+ Tap to add products</button>';
  return d.items.map(i=>{
    const p = STATE.products.find(x=>x.id===i.productId);
    if (!p) return "";
    return '<div class="item-row"><div class="item-row-top"><span style="font-weight:700;font-size:13.5px;">'+esc(p.name)+'</span>'+
      '<button style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;" onclick="removeSaleItem(\''+i.productId+'\')">✕</button></div>'+
      '<div class="item-controls">'+
      '<div class="qty-stepper"><button onclick="stepSaleQty(\''+i.productId+'\',-1)">−</button>'+
      '<input type="number" value="'+i.qty+'" onchange="setSaleQty(\''+i.productId+'\',this.value)">'+
      '<button onclick="stepSaleQty(\''+i.productId+'\',1)">+</button></div>'+
      '<span style="font-size:11px;color:#94a3b8;">'+p.unit+' ×</span>'+
      '<input class="rate-input" type="number" value="'+i.price+'" onchange="setSalePrice(\''+i.productId+'\',this.value)">'+
      '<span style="font-weight:800;font-size:13px;width:64px;text-align:right;">'+fmt(i.qty*i.price)+'</span>'+
      '</div></div>';
  }).join('');
}
function saleSummaryInner(){
  const t = saleTotals();
  return summaryRow("Subtotal", fmt(t.subtotal)) + summaryRow("Discount", "-"+fmt(DRAFT.sale.discount||0)) +
    summaryRow("Grand Total", fmt(t.total), true) + summaryRow("Received", fmt(t.paid)) +
    summaryRow("Balance (udhar)", fmt(t.balance), false, t.balance>0);
}
function summaryRow(label,val,bold,accent){
  return '<div class="summary-row'+(bold?" bold":"")+'"><span'+(bold?'':' class="muted"')+'>'+label+'</span>'+
    '<span'+(accent?' class="red" style="font-weight:800;"':bold?'':' style="font-weight:600;"')+'>'+val+'</span></div>';
}

  document.getElementById("saleItemsWrap").innerHTML = saleItemsInner();

function stepSaleQty(pid,delta){
  const it = DRAFT.sale.items.find(i=>i.productId===pid);
  it.qty = Math.max(0.1, Number(it.qty)+delta);
  refreshSaleUI();
}
function setSaleQty(pid,val){ const it=DRAFT.sale.items.find(i=>i.productId===pid); it.qty=Number(val)||0; refreshSaleUI(); }
function setSalePrice(pid,val){ const it=DRAFT.sale.items.find(i=>i.productId===pid); it.price=Number(val)||0; refreshSaleUI(); }
function removeSaleItem(pid){ DRAFT.sale.items = DRAFT.sale.items.filter(i=>i.productId!==pid); refreshSaleUI(); }

    html += '<div class="suggest-row" onmousedown="pickSaleCustomer(\'\')"><div class="sr-name">Walk-in / Cash customer</div></div>';
  }
  matches.forEach(c=>{

function saveSale(){
  const d = DRAFT.sale;
  if (d.items.length===0){ toast("Kam se kam ek product add karein"); return; }
  if ((d.mode==="credit" || d.mode==="partial") && !d.customerId){
    toast("Udhar/partial ke liye customer select karein (Walk-in par udhar track nahi ho sakta)");
    return;
  }

  // If editing, temporarily give back the stock the original sale had taken,
  // so validation checks the true available stock (including what this bill already holds).
  if (d.editId && d.origItems){
    d.origItems.forEach(i=>{ const p=STATE.products.find(x=>x.id===i.productId); if(p) p.qty += Number(i.qty); });
  }

  for (const i of d.items){
    const p = STATE.products.find(x=>x.id===i.productId);
    if (p && Number(i.qty) > p.qty){
      // validation failed — undo the temporary restore so stock stays consistent
      if (d.editId && d.origItems){
        d.origItems.forEach(i2=>{ const p2=STATE.products.find(x=>x.id===i2.productId); if(p2) p2.qty -= Number(i2.qty); });
      }
      toast(p.name+": stock kam hai ("+fmtQty(p.qty)+" "+p.unit+" available)"); return;
    }
  }

  const t = saleTotals();
  const profit = d.items.reduce((a,i)=>{
    const p = STATE.products.find(x=>x.id===i.productId);
    return p ? a + (Number(i.price)-p.purchasePrice)*Number(i.qty) : a;
  },0);

  const saleId = d.editId || uid();
  const billNo = d.editId ? d.origBillNo : (STATE.sales.length + 1001);
  const date = d.editId ? d.origDate : todayStr();
  const time = d.editId ? d.origTime : new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});

  if (d.editId) STATE.sales = STATE.sales.filter(s=>s.id!==d.editId);
  STATE.sales.push({id:saleId,billNo,customerId:d.customerId||null,date,time,items:d.items,subtotal:t.subtotal,discount:Number(d.discount)||0,total:t.total,paid:t.paid,balance:t.balance,mode:d.mode,profit});

  d.items.forEach(i=>{
    const p = STATE.products.find(x=>x.id===i.productId);
    if (p) p.qty -= Number(i.qty);
  });
  persist();
  toast(d.editId ? ("Bill #"+billNo+" updated") : ("Bill #"+billNo+" saved"));
  DRAFT.sale=null;
  TAB="sales"; openScreen({type:"billView", id:saleId});
}

/* ---------- Barcode Scanning ----------
   Two input methods:
   1. USB/Bluetooth barcode scanner (acts like a keyboard) — just types into
      the focused text input and sends Enter. Works everywhere, no permissions.
   2. Camera scan via the browser's native BarcodeDetector API, where supported.
      Needs camera permission + a "secure context" (https/localhost); many
      local file:// pages or in-app previews will NOT support this — the
      manual/HID input above always works as the reliable fallback.
------------------------------------------------------------------ */
let barcodeCameraStream = null;

function openBarcodeScan(context){
  DRAFT.scanContext = context;
  const host = document.getElementById("toastHost");
  const title = context==="lookup" ? "Scan Barcode — Product Lookup" :
                context==="sale" ? "Scan Barcode — Add to Sale" :
                context==="purchase" ? "Scan Barcode — Add to Purchase" : "Scan Barcode";
  let html = '<div class="modal-overlay" onclick="closeScanModal(event)"><div class="modal-sheet" onclick="event.stopPropagation()">'+
    '<div class="modal-title">'+title+'</div>'+
    '<div class="field"><label class="field-label">Barcode number</label>'+
    '<input type="text" id="scanInput" placeholder="Scanner se scan karein ya type karke Enter dabayein" inputmode="numeric" onkeydown="if(event.key===\'Enter\'){handleScanSubmit();}">'+
    '</div>'+
    '<button class="btn primary" onclick="handleScanSubmit()" style="margin-bottom:8px;">Lookup / Add</button>'+
    '<button class="btn" style="background:#f1f5f9;color:#334155;" onclick="tryCameraScan()">📷 Scan with Camera</button>'+
    '<div id="camScanArea" style="margin-top:10px;"></div>'+
    '<div id="scanResultArea" style="margin-top:10px;"></div>'+
    '</div></div>';
  host.innerHTML = html;
  setTimeout(()=>{ const el=document.getElementById("scanInput"); if(el) el.focus(); }, 30);
}
function closeScanModal(e){
  if (e && e.target!==e.currentTarget) return;
  stopCameraScan();
  document.getElementById("toastHost").innerHTML="";
}
function handleScanSubmit(){
  const code = document.getElementById("scanInput").value.trim();
  if (!code){ toast("Barcode number daalein"); return; }
  processScannedCode(code);
}
function processScannedCode(code){
  const ctx = DRAFT.scanContext;
  const product = STATE.products.find(p=>p.barcode && p.barcode===code);
  const resultArea = document.getElementById("scanResultArea");

  if (!product){
    if (resultArea) resultArea.innerHTML =
      '<div class="card" style="background:#fff7ed;border-color:#fed7aa;">'+
      '<div style="font-weight:700;font-size:13px;color:#9a3412;margin-bottom:6px;">❓ Ye barcode aapki product list me nahi hai</div>'+
      '<div style="font-size:12px;color:#7c2d12;margin-bottom:10px;">Barcode: '+esc(code)+'<br>Isse ek baar naya product ke roop me add karein — agli baar isi barcode se sab kuch auto-fill ho jaayega.</div>'+
      '<button class="btn primary" onclick="addProductFromScan(\''+esc(code).replace(/'/g,"\\'")+'\')">+ Naya Product Add Karein</button>'+
      '</div>';
    return;
  }

  if (ctx==="sale"){
    if (!DRAFT.sale.items.find(i=>i.productId===product.id)) DRAFT.sale.items.push({productId:product.id,qty:1,price:product.sellingPrice});
    stopCameraScan();
    document.getElementById("toastHost").innerHTML="";
    refreshSaleUI();
    toast(product.name+" added");
  } else if (ctx==="purchase"){
    if (!DRAFT.purchase.items.find(i=>i.productId===product.id)) DRAFT.purchase.items.push({productId:product.id,qty:1,rate:product.purchasePrice});
    stopCameraScan();
    document.getElementById("toastHost").innerHTML="";
    refreshPurchaseUI();
    toast(product.name+" added");
  } else if (ctx==="productForm"){
    document.getElementById("f_barcode").value = code;
    stopCameraScan();
    document.getElementById("toastHost").innerHTML="";
    toast("Barcode filled");
  } else {
    // standalone lookup — show full product details
    const low = product.qty<=product.minLevel;
    if (resultArea) resultArea.innerHTML =
      '<div class="card">'+
      '<div style="font-weight:800;font-size:15px;margin-bottom:8px;">'+esc(product.name)+'</div>'+
      summaryRow("Category", esc(product.category)) +
      summaryRow("Barcode", esc(product.barcode)) +
      summaryRow("MRP / Selling Price", fmt(product.sellingPrice)) +
      summaryRow("Purchase Price", fmt(product.purchasePrice)) +
      summaryRow("Current Stock", fmtQty(product.qty)+" "+product.unit) +
      (product.batchNumber ? summaryRow("Batch Number", esc(product.batchNumber)) : "") +
      (product.expiryDate ? summaryRow("Expiry Date", product.expiryDate) : "") +
      (low ? '<div class="tiny orange" style="margin-top:6px;">⚠️ Low stock</div>' : '') +
      '</div>';
  }
}
function addProductFromScan(code){
  DRAFT.productForm = {name:"",category:"General",unit:"piece",purchasePrice:"",sellingPrice:"",qty:"",minLevel:"",batchNumber:"",expiryDate:"",barcode:code};
  stopCameraScan();
  document.getElementById("toastHost").innerHTML="";
  openScreen({type:"productForm"});
}
async function tryCameraScan(){
  const area = document.getElementById("camScanArea");
  if (!("BarcodeDetector" in window)){
    area.innerHTML = '<div class="tiny" style="color:#b91c1c;padding:8px 0;">Is browser/viewer me camera scan support nahi hai. USB/Bluetooth barcode scanner se scan karein — wo upar wale box me seedha type ho jaayega, ya barcode number type karke Enter dabayein.</div>';
    return;
  }
  try {
    barcodeCameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    area.innerHTML = '<video id="camVideo" autoplay playsinline style="width:100%;border-radius:10px;background:#000;"></video>';
    const video = document.getElementById("camVideo");
    video.srcObject = barcodeCameraStream;
    const detector = new BarcodeDetector();
    const scanLoop = async () => {
      if (!barcodeCameraStream) return;
      try {
        const codes = await detector.detect(video);
        if (codes && codes.length>0){
          const val = codes[0].rawValue;
          document.getElementById("scanInput").value = val;
          stopCameraScan();
          processScannedCode(val);
          return;
        }
      } catch(e){ /* keep trying */ }
      requestAnimationFrame(scanLoop);
    };
    requestAnimationFrame(scanLoop);
  } catch(err){
    area.innerHTML = '<div class="tiny" style="color:#b91c1c;padding:8px 0;">Camera access nahi mil paaya (permission block ya unsupported). USB/Bluetooth scanner istemal karein, ya barcode number manually type karke Enter dabayein.</div>';
  }
}
function stopCameraScan(){
  if (barcodeCameraStream){
    barcodeCameraStream.getTracks().forEach(t=>t.stop());
    barcodeCameraStream = null;
  }
}

function purchTotals(){
  const d = DRAFT.purchase;
  const subtotal = d.items.reduce((a,i)=>a+Number(i.qty||0)*Number(i.rate||0),0);
  const total = Math.max(subtotal - Number(d.discount||0), 0);
  const isCredit = d.mode==="credit";
  const paid = isCredit ? 0 : d.mode==="partial" ? Number(d.received||0) : total;
  const balance = Math.max(total-paid,0);
  return {subtotal,total,paid,balance};
}

async function savePurchase(){
  const d = DRAFT.purchase;
  if (!d.supplierId){ toast("Supplier select karein"); return; }
  if (d.items.length===0){ toast("Kam se kam ek product add karein"); return; }
  const pendingBlob = d._pendingBillBlob;
  const btn = document.getElementById("pu_saveBtn");
  const t = purchTotals();

  if (pendingBlob && !navigator.onLine){
    toast("Photo upload karne ke liye internet connection zaroori hai");
    return;
  }
  if (btn) btn.disabled = true;

  const invoiceNo = document.getElementById("purchInvoice").value || ("PO-"+(STATE.purchases.length+1));
  const purchaseId = uid();
  let billPhotoUrl = d.billPhoto || "";

  if (pendingBlob){
    try {
      if (btn) btn.textContent = "Photo upload ho rahi hai...";
      const folder = "mydukaan/shops/"+CURRENT_SHOP_ID+"/purchases/"+purchaseId;
      billPhotoUrl = await uploadImageToStorage(pendingBlob, folder);
    } catch(e){
      toast("Photo upload fail ho gayi — internet check karke dobara try karein");
      if (btn){ btn.disabled = false; btn.textContent = "Save Purchase · "+fmt(t.total); }
      return;
    }
  }

  if (btn) btn.textContent = "Purchase save ho raha hai...";
  if (d._pendingBillPreviewUrl) URL.revokeObjectURL(d._pendingBillPreviewUrl);
  STATE.purchases.push({id:purchaseId,invoiceNo,supplierId:d.supplierId,date:todayStr(),items:d.items,subtotal:t.subtotal,discount:Number(d.discount)||0,total:t.total,paid:t.paid,balance:t.balance,mode:d.mode,billPhoto:billPhotoUrl});
  d.items.forEach(i=>{
    const p = STATE.products.find(x=>x.id===i.productId);
    if (p){ p.qty += Number(i.qty); p.purchasePrice = Number(i.rate); }
  });
  persist();
  toast("Purchase saved");
  DRAFT.purchase=null;
  TAB="purchase"; SCREEN=null; render();
}

function pdfEscapeText(str){
  str = String(str==null?"":str).replace(/₹/g,"Rs.");
  let out = "";
  for (let i=0;i<str.length;i++){
    const code = str.charCodeAt(i);
    out += (code>=32 && code<=255) ? str[i] : "?";
  }
  return out.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
}

    return {
      name: p?p.name:"Item",
      qty: fmtQty(i.qty)+(p?(" "+p.unit):""),
      rate: pdfFmtMoney(i.price),
      total: pdfFmtMoney(i.qty*i.price)
    };
  });

  const pageWidth = 320;
  const lineH = 15;
  const topMargin = 24;
  const bottomMargin = 24;
  const extraLines = (address||mobile?1:0) + (gst?1:0);
  const headerLines = 1 + extraLines + 3 + 4;
  const footerLines = 8;
  const totalRows = headerLines + items.length + footerLines;
  const pageHeight = Math.max(360, topMargin + bottomMargin + totalRows*lineH + 20);

  const rows = [];
  let y = pageHeight - topMargin;
  function row(segs, size, bold, gap){
    rows.push({y, segs: segs.map(sg => (typeof sg==="string") ? {t:sg,x:20,size:size||9,bold:!!bold} : Object.assign({size:size||9,bold:!!bold},sg)) });
    y -= (gap || lineH);
  }
  function divider(){ rows.push({divider:true, y}); y -= 10; }

  row([shopName], 15, true, lineH+3);
  if (address||mobile) row([[address,mobile].filter(Boolean).join("   |   ")], 8, false);
  if (gst) row(["GST: "+gst], 8, false);
  y -= 3;
  divider();
  row([{t:"Bill No: #"+s.billNo,x:20},{t:"Date: "+s.date+(s.time?(" "+s.time):""),x:170}], 8);
  row([{t:"Payment: "+modeLabel,x:20},{t:"Customer: "+custName,x:170}], 8);
  if (custMobile) row([{t:"",x:20},{t:"Mobile: "+custMobile,x:170}],8);
  divider();
  row([{t:"ITEM",x:20},{t:"QTY",x:150},{t:"RATE",x:210},{t:"TOTAL",x:270}], 8, true);
  divider();
  items.forEach(it=>{
    row([{t:it.name,x:20},{t:it.qty,x:150},{t:it.rate,x:210},{t:it.total,x:270}], 9);
  });
  divider();
  row([{t:"Subtotal",x:20},{t:pdfFmtMoney(s.subtotal),x:230}],9);
  row([{t:"Discount",x:20},{t:"-"+pdfFmtMoney(s.discount),x:230}],9);
  row([{t:"Grand Total",x:20,bold:true},{t:pdfFmtMoney(s.total),x:230,bold:true}],10,true);
  row([{t:"Paid",x:20},{t:pdfFmtMoney(s.paid),x:230}],9);
  row([{t:"Balance",x:20},{t:pdfFmtMoney(s.balance),x:230}],9);
  divider();
  row(["Thank You for shopping with us!"], 9, false);

  let content = "";
  rows.forEach(r=>{
    if (r.divider){
      content += "0.5 w\n" + 20 + " " + r.y.toFixed(1) + " m " + (pageWidth-20) + " " + r.y.toFixed(1) + " l S\n";
      return;
    }
    r.segs.forEach(seg=>{
      if (!seg.t) return;
      const font = seg.bold ? "/F2" : "/F1";
      content += "BT\n"+font+" "+seg.size+" Tf\n1 0 0 1 "+seg.x+" "+r.y.toFixed(1)+" Tm\n("+pdfEscapeText(seg.t)+") Tj\nET\n";
    });
  });

  return assemblePDF(pageWidth, pageHeight, content);
}
function assemblePDF(pageWidth, pageHeight, contentStream){
  const enc = new TextEncoder();
  const objs = [];
  objs.push("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");
  objs.push("2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");
  objs.push("3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pageWidth+" "+pageHeight.toFixed(1)+"] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>\nendobj\n");
  const streamBytes = enc.encode(contentStream);
  objs.push("4 0 obj\n<< /Length "+streamBytes.length+" >>\nstream\n" + contentStream + "\nendstream\nendobj\n");
  objs.push("5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n");
  objs.push("6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj\n");

  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  objs.forEach(o=>{
    offsets.push(enc.encode(pdf).length);
    pdf += o;
  });
  const xrefStart = enc.encode(pdf).length;
  pdf += "xref\n0 "+(objs.length+1)+"\n";
  pdf += "0000000000 65535 f \n";
  for (let i=1;i<=objs.length;i++){
    pdf += String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  }
  pdf += "trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF";
  return enc.encode(pdf);
}
function downloadBillPDF(saleId){
  const s = STATE.sales.find(x=>x.id===saleId);
  if (!s) return;
  const bytes = buildBillPDFBytes(s);
  const blob = new Blob([bytes], {type:"application/pdf"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (STATE.settings.shopName||"Bill").replace(/\s+/g,"_") + "_Bill_" + s.billNo + ".pdf";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function shareBillWhatsApp(saleId){
  const s = STATE.sales.find(x=>x.id===saleId);
  if (!s) return;
  const shopName = STATE.settings.shopName || "our shop";
  const fileName = (shopName.replace(/\s+/g,"_")) + "_Bill_" + s.billNo + ".pdf";
  const bytes = buildBillPDFBytes(s);
  const blob = new Blob([bytes], {type:"application/pdf"});
  const cust = STATE.customers.find(c=>c.id===s.customerId);
  const msg = "Thank you for shopping at "+shopName+". Your bill #"+s.billNo+" of "+fmt(s.total)+" is generated.";

  try {
    const file = new File([blob], fileName, {type:"application/pdf"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Bill #"+s.billNo, text:msg});
      return;
    }
  } catch(e){ if (e && e.name === "AbortError") return; }

  downloadBillPDF(saleId);
  toast("PDF download ho gaya — WhatsApp me manually attach kar dein");
  let url;
  if (cust && cust.mobile) {
    const phone = cust.mobile.replace(/[^0-9]/g,"");
    url = "https://wa.me/91"+phone+"?text="+encodeURIComponent(msg);
  } else {
    url = "https://wa.me/?text="+encodeURIComponent(msg);
  }
  window.open(url, "_blank");
}

function downloadBackup(){
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mydukaan-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Backup downloaded");
}
function restoreBackup(){
  const input = document.getElementById("restoreFile");
  const file = input.files && input.files[0];
  if (!file){ toast("Pehle ek file select karein"); return; }
  const ok = confirm("Yeh aapka current data overwrite kar dega. Continue karein?");
  if (!ok) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = JSON.parse(e.target.result);
      if (!data.products || !data.sales){ toast("Yeh valid backup file nahi lag rahi"); return; }
      if (!data.settings) data.settings = { shopName:"My Shop", address:"", mobile:"", gst:"", invoicePrefix:"INV", currency:"INR" };
      STATE = data;
      persist();
      toast("Data restore ho gaya");
      navTab("dashboard");
    } catch(err){
      toast("File padhne me error aayi");
    }
  };
  reader.readAsText(file);
}

    return;
  }
  ROUTE = "login";
  render();
  hideSplash();
}
setTimeout(boot, 300);
</script>
